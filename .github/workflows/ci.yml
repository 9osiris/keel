name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Regression suite
        run: python -m unittest discover -s tests -v
      - name: Compile and run offline example
        run: |
          python -m compileall -q keel examples tests
          python examples/demo.py
      - name: Build, install and smoke-test CLI
        run: |
          python -m pip install --no-deps .
          keel --help
          keel --db "$RUNNER_TEMP/keel.db" new smoke --policy examples/policy.json
          keel --db "$RUNNER_TEMP/keel.db" verify smoke
