name: Bootstrap Keel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Write implementation and regression suite
        shell: python
        run: |
          from pathlib import Path
          files = {}
          files['pyproject.toml'] = r'''
          [build-system]
          requires = ["setuptools>=68"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "keel-policy"
          version = "0.1.0"
          description = "Transactional policy gates and counterfactual replay for AI tool calls"
          readme = "README.md"
          requires-python = ">=3.11"
          license = {text = "MIT"}
          authors = [{name = "9osiris"}]
          dependencies = []

          [project.scripts]
          keel = "keel.cli:main"

          [project.urls]
          Repository = "https://github.com/9osiris/keel"

          [tool.setuptools.packages.find]
          include = ["keel*"]
          '''
          files['.gitignore'] = r'''
          __pycache__/
          *.py[cod]
          *.db
          *.db-*
          *.sqlite*
          *.egg-info/
          build/
          dist/
          .venv/
          request.json
          decisions.jsonl
          '''
          files['LICENSE'] = r'''
          MIT License

          Copyright (c) 2026 9osiris

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          '''
          files['keel/__init__.py'] = r'''
          """Keel: an auditable, transactional policy boundary, not a tool executor."""
          from .model import Conflict, Decision, IntegrityError, KeelError, Request, Usage
          from .policy import Policy
          from .store import Journal
          from .replay import replay

          __version__ = "0.1.0"
          __all__ = ["Journal", "Policy", "Request", "Decision", "Usage", "replay",
                     "KeelError", "Conflict", "IntegrityError"]
          '''
          files['keel/__main__.py'] = r'''
          from .cli import main

          raise SystemExit(main())
          '''
          files['keel/model.py'] = r'''
          """Validated JSON value objects shared by storage and the pure evaluator."""
          from dataclasses import dataclass
          import hashlib
          import json
          import math
          from typing import Any


          class KeelError(Exception):
              """Expected application error, safe to surface through the CLI."""


          class Conflict(KeelError):
              """An immutable identifier was reused with different content."""


          class IntegrityError(KeelError):
              """The stored journal no longer verifies."""


          def integer(value: Any, name: str) -> int:
              if type(value) is not int or value < 0:
                  raise ValueError(f"{name} must be a non-negative integer")
              return value


          def text(value: Any, name: str) -> str:
              if not isinstance(value, str) or not value.strip():
                  raise ValueError(f"{name} must be a non-empty string")
              return value


          def _json_value(value: Any) -> None:
              if value is None or type(value) in (bool, str, int):
                  return
              if type(value) is float and math.isfinite(value):
                  return
              if type(value) is list:
                  for item in value:
                      _json_value(item)
                  return
              if type(value) is dict and all(type(k) is str for k in value):
                  for item in value.values():
                      _json_value(item)
                  return
              raise ValueError("expected finite JSON values with string object keys")


          def canonical(value: Any) -> str:
              _json_value(value)
              return json.dumps(value, sort_keys=True, separators=(",", ":"),
                                ensure_ascii=True, allow_nan=False)


          def digest(value: Any) -> str:
              return hashlib.sha256(canonical(value).encode("utf-8")).hexdigest()


          @dataclass(frozen=True)
          class Request:
              id: str
              tool: str
              args: dict
              cost_micros: int = 0
              actor: str = "agent"

              def __post_init__(self):
                  text(self.id, "request id")
                  text(self.tool, "tool")
                  text(self.actor, "actor")
                  integer(self.cost_micros, "cost_micros")
                  if type(self.args) is not dict:
                      raise ValueError("args must be an object")
                  canonical(self.args)

              def to_dict(self) -> dict:
                  return {"id": self.id, "tool": self.tool,
                          "args": json.loads(canonical(self.args)),
                          "cost_micros": self.cost_micros, "actor": self.actor}

              @classmethod
              def from_dict(cls, data: dict) -> "Request":
                  keys = {"id", "tool", "args", "cost_micros", "actor"}
                  if type(data) is not dict or set(data) - keys:
                      raise ValueError("invalid request fields")
                  if not {"id", "tool", "args"} <= set(data):
                      raise ValueError("request needs id, tool and args")
                  return cls(**data)


          @dataclass(frozen=True)
          class Usage:
              spent_micros: int = 0
              calls: int = 0

              def __post_init__(self):
                  integer(self.spent_micros, "spent_micros")
                  integer(self.calls, "calls")


          @dataclass(frozen=True)
          class Decision:
              allowed: bool
              reasons: tuple[str, ...]
              spent_micros: int
              calls: int

              def to_dict(self) -> dict:
                  return {"allowed": self.allowed, "reasons": list(self.reasons),
                          "spent_micros": self.spent_micros, "calls": self.calls}

              @classmethod
              def from_dict(cls, data: dict) -> "Decision":
                  return cls(data["allowed"], tuple(data["reasons"]),
                             data["spent_micros"], data["calls"])

              @property
              def usage(self) -> Usage:
                  return Usage(self.spent_micros, self.calls)
          '''
          files['keel/policy.py'] = r'''
          """Strict versioned policy parsing and deterministic, side-effect-free decisions."""
          import json
          from fnmatch import fnmatchcase
          from .model import Decision, Request, Usage, canonical, digest, integer, text


          def _strings(value, name):
              if type(value) is not list:
                  raise ValueError(f"{name} must be an array")
              for item in value:
                  text(item, name)
              if len(value) != len(set(value)):
                  raise ValueError(f"{name} contains duplicates")
              return sorted(value)


          class Policy:
              """Canonical configuration; to_dict returns a copy, not mutable policy state."""
              __slots__ = ("_json",)

              def __init__(self, data: dict):
                  required = {"version", "allowed_tools", "max_spend_micros",
                              "max_call_micros", "max_calls"}
                  optional = {"denied_tools", "actors", "required_args"}
                  if type(data) is not dict or set(data) - required - optional:
                      raise ValueError("unknown policy fields or non-object policy")
                  if not required <= set(data):
                      raise ValueError("policy is missing required fields")
                  if type(data["version"]) is not int or data["version"] != 1:
                      raise ValueError("unsupported policy version")
                  c = {"version": 1}
                  for name in ("allowed_tools", "denied_tools", "actors"):
                      c[name] = _strings(data.get(name, []), name)
                  for name in ("max_spend_micros", "max_call_micros", "max_calls"):
                      c[name] = integer(data[name], name)
                  rules = data.get("required_args", {})
                  if type(rules) is not dict:
                      raise ValueError("required_args must be an object")
                  c["required_args"] = {}
                  for pattern, names in rules.items():
                      text(pattern, "required_args pattern")
                      c["required_args"][pattern] = _strings(names, "required_args keys")
                  self._json = canonical(c)

              @classmethod
              def from_dict(cls, data: dict) -> "Policy":
                  return cls(data)

              def to_dict(self) -> dict:
                  return json.loads(self._json)

              @property
              def fingerprint(self) -> str:
                  return digest(self.to_dict())

              def evaluate(self, request: Request, usage: Usage = Usage()) -> Decision:
                  # Re-validate and snapshot even if caller mutated Request.args.
                  request = Request.from_dict(request.to_dict())
                  c = self.to_dict()
                  reasons = []
                  if any(fnmatchcase(request.tool, p) for p in c["denied_tools"]):
                      reasons.append("tool_denied")
                  if not any(fnmatchcase(request.tool, p) for p in c["allowed_tools"]):
                      reasons.append("tool_not_allowed")
                  if c["actors"] and request.actor not in c["actors"]:
                      reasons.append("actor_not_allowed")
                  missing = set()
                  for pattern, names in c["required_args"].items():
                      if fnmatchcase(request.tool, pattern):
                          missing.update(set(names) - request.args.keys())
                  reasons.extend(f"missing_argument:{key}" for key in sorted(missing))
                  if request.cost_micros > c["max_call_micros"]:
                      reasons.append("call_cost_exceeded")
                  if usage.spent_micros + request.cost_micros > c["max_spend_micros"]:
                      reasons.append("run_budget_exceeded")
                  if usage.calls >= c["max_calls"]:
                      reasons.append("call_quota_exceeded")
                  allowed = not reasons
                  return Decision(allowed, tuple(reasons),
                                  usage.spent_micros + (request.cost_micros if allowed else 0),
                                  usage.calls + int(allowed))
          '''
          files['keel/store.py'] = r'''
          """A local SQLite reservation ledger. No tools are executed by this module."""
          from contextlib import contextmanager
          from datetime import datetime, timezone
          import hashlib
          import json
          import sqlite3
          from .model import (Conflict, Decision, IntegrityError, KeelError,
                              Request, Usage, canonical, digest, text)
          from .policy import Policy

          SCHEMA = """
          CREATE TABLE IF NOT EXISTS runs (
              id TEXT PRIMARY KEY,
              policy TEXT NOT NULL,
              policy_hash TEXT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS events (
              run_id TEXT NOT NULL REFERENCES runs(id),
              seq INTEGER NOT NULL,
              request_id TEXT NOT NULL,
              payload TEXT NOT NULL,
              prev_hash TEXT NOT NULL,
              hash TEXT NOT NULL,
              PRIMARY KEY (run_id, seq),
              UNIQUE (run_id, request_id)
          );
          """


          def _chain(previous: str, payload: str) -> str:
              return hashlib.sha256((previous + "\n" + payload).encode("utf-8")).hexdigest()


          class Journal:
              def __init__(self, path="keel.db"):
                  self.db = sqlite3.connect(path, timeout=30, isolation_level=None)
                  self.db.row_factory = sqlite3.Row
                  self.db.execute("PRAGMA foreign_keys = ON")
                  self.db.executescript(SCHEMA)

              def close(self):
                  self.db.close()

              def __enter__(self):
                  return self

              def __exit__(self, *exc):
                  self.close()

              @contextmanager
              def _transaction(self, write=False):
                  self.db.execute("BEGIN IMMEDIATE" if write else "BEGIN")
                  try:
                      yield
                      self.db.execute("COMMIT")
                  except BaseException:
                      self.db.execute("ROLLBACK")
                      raise

              def create_run(self, run_id: str, policy: Policy):
                  text(run_id, "run id")
                  config = canonical(policy.to_dict())
                  with self._transaction(write=True):
                      old = self.db.execute("SELECT * FROM runs WHERE id=?", (run_id,)).fetchone()
                      if old:
                          if old["policy"] != config or old["policy_hash"] != policy.fingerprint:
                              raise Conflict("run already exists with a different policy")
                          return
                      self.db.execute("INSERT INTO runs VALUES (?, ?, ?)",
                                      (run_id, config, policy.fingerprint))

              def _verified(self, run_id):
                  run = self.db.execute("SELECT * FROM runs WHERE id=?", (run_id,)).fetchone()
                  if run is None:
                      raise KeelError(f"unknown run: {run_id}")
                  try:
                      policy = Policy.from_dict(json.loads(run["policy"]))
                      if (canonical(policy.to_dict()) != run["policy"] or
                              policy.fingerprint != run["policy_hash"]):
                          raise IntegrityError("run policy fingerprint mismatch")
                      head = digest({"run": run_id, "policy": policy.to_dict()})
                      usage = Usage()
                      events = []
                      seen = set()
                      rows = self.db.execute(
                          "SELECT * FROM events WHERE run_id=? ORDER BY seq", (run_id,))
                      for expected_seq, row in enumerate(rows, 1):
                          p = json.loads(row["payload"])
                          if set(p) != {"run", "seq", "at", "request", "decision"}:
                              raise IntegrityError("invalid event envelope")
                          if (row["seq"] != expected_seq or p["seq"] != expected_seq or
                                  type(p["seq"]) is not int or p["run"] != run_id):
                              raise IntegrityError("non-contiguous or mismatched sequence")
                          text(p["at"], "event timestamp")
                          if canonical(p) != row["payload"]:
                              raise IntegrityError("non-canonical event payload")
                          if row["prev_hash"] != head or row["hash"] != _chain(head, row["payload"]):
                              raise IntegrityError("event hash chain mismatch")
                          request = Request.from_dict(p["request"])
                          if (canonical(request.to_dict()) != canonical(p["request"]) or
                                  request.id != row["request_id"] or request.id in seen):
                              raise IntegrityError("request identity mismatch")
                          decision = policy.evaluate(request, usage)
                          if canonical(decision.to_dict()) != canonical(p["decision"]):
                              raise IntegrityError("stored decision violates pinned policy")
                          usage = decision.usage
                          head = row["hash"]
                          seen.add(request.id)
                          events.append(p)
                      return policy, events, usage, head
                  except (ValueError, TypeError, KeyError, AttributeError) as exc:
                      raise IntegrityError(f"invalid journal data: {exc}") from exc

              def submit(self, run_id: str, request: Request) -> Decision:
                  request = Request.from_dict(request.to_dict())
                  with self._transaction(write=True):
                      policy, events, usage, head = self._verified(run_id)
                      for event in events:
                          if event["request"]["id"] == request.id:
                              if canonical(event["request"]) != canonical(request.to_dict()):
                                  raise Conflict("request id reused with different content")
                              return Decision.from_dict(event["decision"])
                      decision = policy.evaluate(request, usage)
                      payload = canonical({
                          "run": run_id, "seq": len(events) + 1,
                          "at": datetime.now(timezone.utc).isoformat(),
                          "request": request.to_dict(), "decision": decision.to_dict(),
                      })
                      self.db.execute("INSERT INTO events VALUES (?, ?, ?, ?, ?, ?)",
                                      (run_id, len(events) + 1, request.id, payload,
                                       head, _chain(head, payload)))
                      return decision

              def events(self, run_id: str) -> list[dict]:
                  with self._transaction():
                      return self._verified(run_id)[1]

              def verify(self, run_id: str) -> dict:
                  with self._transaction():
                      policy, events, usage, head = self._verified(run_id)
                      return {"run": run_id, "events": len(events), "head": head,
                              "spent_micros": usage.spent_micros, "calls": usage.calls,
                              "policy_hash": policy.fingerprint}
          '''
          files['keel/replay.py'] = r'''
          """Counterfactual policy replay of fixed proposals, never tool re-execution."""
          from .model import Request, Usage
          from .policy import Policy
          from .store import Journal


          def replay(journal: Journal, run_id: str, policy: Policy) -> dict:
              usage = Usage()
              trace = []
              changes = []
              # One verified snapshot: concurrent appends cannot alter this replay.
              for event in journal.events(run_id):
                  request = Request.from_dict(event["request"])
                  after = policy.evaluate(request, usage)
                  usage = after.usage
                  before = event["decision"]
                  if before["allowed"] != after.allowed:
                      changes.append(request.id)
                  trace.append({"seq": event["seq"], "request_id": request.id,
                                "before": before, "after": after.to_dict()})
              return {"run": run_id, "policy_hash": policy.fingerprint,
                      "changed": changes, "spent_micros": usage.spent_micros,
                      "calls": usage.calls, "trace": trace}
          '''
          files['keel/cli.py'] = r'''
          """Machine-readable command line interface with stable exit codes."""
          import argparse
          import json
          import sqlite3
          import sys
          from .model import KeelError, Request, canonical
          from .policy import Policy
          from .replay import replay
          from .store import Journal


          def _read(path):
              if path == "-":
                  return json.load(sys.stdin)
              with open(path, encoding="utf-8") as stream:
                  return json.load(stream)


          def main(argv=None):
              parser = argparse.ArgumentParser(prog="keel", description=__doc__)
              parser.add_argument("--db", default="keel.db", help="local SQLite journal")
              sub = parser.add_subparsers(dest="command", required=True)
              new = sub.add_parser("new", help="pin a policy to a new run")
              new.add_argument("run")
              new.add_argument("--policy", required=True)
              gate = sub.add_parser("gate", help="atomically reserve a proposal")
              gate.add_argument("run")
              gate.add_argument("--request", default="-", help="JSON file or - for stdin")
              for command in ("verify", "export"):
                  sub.add_parser(command).add_argument("run")
              rep = sub.add_parser("replay", help="counterfactual evaluation, no execution")
              rep.add_argument("run")
              rep.add_argument("--policy", required=True)
              rep.add_argument("--fail-on-change", action="store_true")
              args = parser.parse_args(argv)
              try:
                  with Journal(args.db) as journal:
                      if args.command == "new":
                          journal.create_run(args.run, Policy.from_dict(_read(args.policy)))
                          result = journal.verify(args.run)
                      elif args.command == "gate":
                          decision = journal.submit(args.run, Request.from_dict(_read(args.request)))
                          print(canonical(decision.to_dict()))
                          return 0 if decision.allowed else 2
                      elif args.command == "verify":
                          result = journal.verify(args.run)
                      elif args.command == "export":
                          for event in journal.events(args.run):
                              print(canonical(event))
                          return 0
                      else:
                          result = replay(journal, args.run, Policy.from_dict(_read(args.policy)))
                          print(canonical(result))
                          return 2 if args.fail_on_change and result["changed"] else 0
                      print(canonical(result))
                      return 0
              except (KeelError, ValueError, TypeError, OSError, sqlite3.Error) as exc:
                  print(json.dumps({"error": str(exc)}), file=sys.stderr)
                  return 1
          '''
          files['examples/policy.json'] = r'''
          {
            "version": 1,
            "allowed_tools": ["fs.read", "search.*"],
            "denied_tools": ["search.private"],
            "max_spend_micros": 100000,
            "max_call_micros": 20000,
            "max_calls": 10,
            "actors": [],
            "required_args": {"fs.read": ["path"], "search.*": ["query"]}
          }
          '''
          files['examples/demo.py'] = r'''
          """Run directly from a checkout; never uses a model, network or real tool."""
          import json
          from pathlib import Path
          import sys
          import tempfile

          sys.path.insert(0, str(Path(__file__).resolve().parents[1]))
          from keel import Journal, Policy, Request, replay


          def main():
              config = {
                  "version": 1, "allowed_tools": ["search.*"],
                  "max_spend_micros": 10, "max_call_micros": 10, "max_calls": 5,
              }
              with tempfile.TemporaryDirectory() as directory:
                  with Journal(Path(directory) / "demo.db") as journal:
                      journal.create_run("demo", Policy(config))
                      for request in (Request("first", "search.web", {"query": "a"}, 7),
                                      Request("later", "search.local", {"query": "b"}, 5)):
                          print(request.id, journal.submit("demo", request).to_dict())
                      config["denied_tools"] = ["search.web"]
                      result = replay(journal, "demo", Policy(config))
                      assert result["changed"] == ["first", "later"]
                      assert result["spent_micros"] == 5
                      assert journal.verify("demo")["spent_micros"] == 7
                      print(json.dumps(result, indent=2))


          if __name__ == "__main__":
              main()
          '''
          files['tests/test_keel.py'] = r'''
          """Real SQLite, real subprocess CLI, no mocking of the transaction boundary."""
          from concurrent.futures import ThreadPoolExecutor
          import hashlib
          import json
          from pathlib import Path
          import sqlite3
          import subprocess
          import sys
          import tempfile
          import unittest

          from keel import Conflict, IntegrityError, Journal, KeelError, Policy, Request, Usage, replay
          from keel.model import canonical


          def policy(**changes):
              config = {"version": 1, "allowed_tools": ["*"],
                        "max_spend_micros": 10, "max_call_micros": 10, "max_calls": 10}
              config.update(changes)
              return Policy.from_dict(config)


          def request(id="a", tool="read", cost=3, **kwargs):
              return Request(id, tool, kwargs.pop("args", {}), cost, **kwargs)


          class PolicyTests(unittest.TestCase):
              def test_deny_precedes_allow(self):
                  p = policy(allowed_tools=["fs.*"], denied_tools=["fs.write"])
                  self.assertIn("tool_denied", p.evaluate(request(tool="fs.write")).reasons)
                  self.assertTrue(p.evaluate(request(tool="fs.read")).allowed)

              def test_empty_allowlist_and_case(self):
                  self.assertFalse(policy(allowed_tools=[]).evaluate(request()).allowed)
                  self.assertFalse(policy(allowed_tools=["read"]).evaluate(request(tool="Read")).allowed)

              def test_actor_allowlist(self):
                  p = policy(actors=["planner"])
                  self.assertFalse(p.evaluate(request()).allowed)
                  self.assertTrue(p.evaluate(request(actor="planner")).allowed)

              def test_all_required_patterns_apply(self):
                  p = policy(required_args={"*": ["trace"], "fs.*": ["path"]})
                  d = p.evaluate(request(tool="fs.read"))
                  self.assertEqual(d.reasons, ("missing_argument:path", "missing_argument:trace"))
                  self.assertTrue(p.evaluate(request(tool="fs.read", args={"path": None, "trace": 1})).allowed)

              def test_exact_budget_boundary(self):
                  self.assertTrue(policy().evaluate(request(cost=10)).allowed)
                  d = policy().evaluate(request(cost=4), Usage(7, 1))
                  self.assertIn("run_budget_exceeded", d.reasons)
                  self.assertEqual(d.usage, Usage(7, 1))

              def test_per_call_limit(self):
                  self.assertIn("call_cost_exceeded", policy(max_call_micros=2).evaluate(request()).reasons)

              def test_zero_cost_still_consumes_quota(self):
                  p = policy(max_calls=1, max_spend_micros=0)
                  first = p.evaluate(request(cost=0))
                  self.assertTrue(first.allowed)
                  self.assertFalse(p.evaluate(request(cost=0), first.usage).allowed)

              def test_invalid_limits(self):
                  for value in (-1, True, 2.5, "10", None):
                      with self.subTest(value=value), self.assertRaises(ValueError):
                          policy(max_spend_micros=value)

              def test_unknown_fields_and_version(self):
                  for changes in ({"typo": 1}, {"version": 2}, {"version": True}, {"actors": "agent"}):
                      with self.subTest(changes=changes), self.assertRaises(ValueError):
                          policy(**changes)
                  with self.assertRaises(ValueError):
                      Policy({"version": 1})

              def test_fingerprint_normalizes_sets_and_defaults(self):
                  a = policy(allowed_tools=["b", "a"])
                  b = policy(allowed_tools=["a", "b"], denied_tools=[], actors=[], required_args={})
                  self.assertEqual(a.fingerprint, b.fingerprint)
                  copied = a.to_dict()
                  copied["allowed_tools"].clear()
                  self.assertEqual(a.fingerprint, b.fingerprint)

              def test_bad_requests_fail_closed(self):
                  for data in ({"id": "x", "tool": "read", "args": {}, "extra": 1},
                               {"id": "x", "tool": "read"},
                               {"id": "x", "tool": "read", "args": [], "cost_micros": 1},
                               {"id": "x", "tool": "read", "args": {}, "cost_micros": True},
                               {"id": "", "tool": "read", "args": {}},
                               {"id": "x", "tool": "read", "args": {"x": float("nan")}}):
                      with self.subTest(data=data), self.assertRaises(ValueError):
                          Request.from_dict(data)

              def test_non_json_python_values(self):
                  for args in ({1: "key"}, {"x": (1, 2)}, {"x": object()}):
                      with self.subTest(args=args), self.assertRaises(ValueError):
                          request(args=args)


          class JournalTests(unittest.TestCase):
              def setUp(self):
                  self.directory = tempfile.TemporaryDirectory()
                  self.addCleanup(self.directory.cleanup)
                  self.path = Path(self.directory.name) / "ledger.db"
                  self.journal = Journal(self.path)
                  self.addCleanup(self.journal.close)
                  self.journal.create_run("run", policy())

              def test_empty_run_verifies(self):
                  result = self.journal.verify("run")
                  self.assertEqual(result["events"], 0)
                  self.assertEqual(len(result["head"]), 64)

              def test_identical_retry_is_idempotent(self):
                  a = self.journal.submit("run", request())
                  self.assertEqual(a, self.journal.submit("run", request()))
                  self.assertEqual(self.journal.verify("run")["calls"], 1)

              def test_conflicting_retry_rolls_back(self):
                  self.journal.submit("run", request())
                  with self.assertRaises(Conflict):
                      self.journal.submit("run", request(cost=4))
                  self.assertEqual(self.journal.verify("run")["events"], 1)
                  self.assertTrue(self.journal.submit("run", request(id="b")).allowed)

              def test_denial_recorded_without_reservation(self):
                  d = self.journal.submit("run", request(cost=11))
                  self.assertFalse(d.allowed)
                  result = self.journal.verify("run")
                  self.assertEqual((result["events"], result["calls"], result["spent_micros"]), (1, 0, 0))

              def test_run_policy_is_pinned(self):
                  self.journal.create_run("run", policy())
                  with self.assertRaises(Conflict):
                      self.journal.create_run("run", policy(max_calls=2))

              def test_unknown_run(self):
                  with self.assertRaises(KeelError):
                      self.journal.submit("missing", request())

              def test_isolated_runs(self):
                  self.journal.create_run("other", policy())
                  self.assertTrue(self.journal.submit("run", request(cost=10)).allowed)
                  self.assertTrue(self.journal.submit("other", request(cost=10)).allowed)

              def test_reopen_and_export_snapshot(self):
                  self.journal.submit("run", request())
                  with Journal(self.path) as other:
                      self.assertEqual(other.events("run"), self.journal.events("run"))
                      events = other.events("run")
                      events[0]["request"]["args"]["mutate"] = True
                      self.assertEqual(other.events("run")[0]["request"]["args"], {})

              def test_tamper_is_detected_and_blocks_append(self):
                  self.journal.submit("run", request())
                  self.journal.db.execute("UPDATE events SET hash='broken'")
                  with self.assertRaises(IntegrityError):
                      self.journal.verify("run")
                  with self.assertRaises(IntegrityError):
                      self.journal.submit("run", request(id="b"))

              def test_gap_is_detected(self):
                  self.journal.submit("run", request())
                  self.journal.submit("run", request(id="b"))
                  self.journal.db.execute("DELETE FROM events WHERE seq=1")
                  with self.assertRaises(IntegrityError):
                      self.journal.verify("run")

              def test_policy_tamper_is_detected(self):
                  self.journal.db.execute("UPDATE runs SET policy_hash='broken'")
                  with self.assertRaises(IntegrityError):
                      self.journal.verify("run")

              def test_rehashed_invalid_decision_is_detected(self):
                  self.journal.submit("run", request())
                  row = self.journal.db.execute("SELECT * FROM events").fetchone()
                  data = json.loads(row["payload"])
                  data["decision"]["spent_micros"] = 0
                  payload = canonical(data)
                  new_hash = hashlib.sha256((row["prev_hash"] + "\n" + payload).encode()).hexdigest()
                  self.journal.db.execute("UPDATE events SET payload=?, hash=?", (payload, new_hash))
                  with self.assertRaises(IntegrityError):
                      self.journal.verify("run")

              def test_concurrent_reservations_cannot_overspend(self):
                  def reserve(index):
                      with Journal(self.path) as journal:
                          return journal.submit("run", request(id=str(index), cost=3)).allowed
                  with ThreadPoolExecutor(max_workers=8) as pool:
                      results = list(pool.map(reserve, range(16)))
                  self.assertEqual(sum(results), 3)
                  self.assertEqual(self.journal.verify("run")["spent_micros"], 9)
                  self.assertEqual(self.journal.verify("run")["events"], 16)

              def test_concurrent_identical_ids_reserve_once(self):
                  def reserve(_):
                      with Journal(self.path) as journal:
                          return journal.submit("run", request()).allowed
                  with ThreadPoolExecutor(max_workers=8) as pool:
                      self.assertTrue(all(pool.map(reserve, range(16))))
                  self.assertEqual(self.journal.verify("run")["events"], 1)

              def test_replay_cascades_and_preserves_original(self):
                  self.journal.submit("run", request(id="early", tool="expensive", cost=7))
                  self.journal.submit("run", request(id="late", tool="cheap", cost=5))
                  before = self.journal.verify("run")
                  result = replay(self.journal, "run", policy(denied_tools=["expensive"]))
                  self.assertEqual(result["changed"], ["early", "late"])
                  self.assertEqual(result["spent_micros"], 5)
                  self.assertEqual(self.journal.verify("run"), before)

              def test_same_policy_replay_has_no_flips(self):
                  self.journal.submit("run", request())
                  self.assertEqual(replay(self.journal, "run", policy())["changed"], [])


          class CLITests(unittest.TestCase):
              def test_cli_end_to_end_and_exit_codes(self):
                  with tempfile.TemporaryDirectory() as directory:
                      db = str(Path(directory) / "cli.db")
                      config = Path(directory) / "policy.json"
                      config.write_text(canonical(policy().to_dict()), encoding="utf-8")

                      def run(*args, input=None):
                          return subprocess.run([sys.executable, "-m", "keel", "--db", db, *args],
                                                input=input, text=True, capture_output=True)

                      self.assertEqual(run("new", "r", "--policy", str(config)).returncode, 0)
                      good = run("gate", "r", input=canonical(request().to_dict()))
                      self.assertEqual(good.returncode, 0, good.stderr)
                      self.assertTrue(json.loads(good.stdout)["allowed"])
                      denied = run("gate", "r", input=canonical(request(id="b", cost=11).to_dict()))
                      self.assertEqual(denied.returncode, 2)
                      invalid = run("gate", "r", input="{}")
                      self.assertEqual(invalid.returncode, 1)
                      self.assertIn("error", json.loads(invalid.stderr))
                      exported = run("export", "r")
                      self.assertEqual(len(exported.stdout.splitlines()), 2)
                      self.assertEqual(json.loads(run("verify", "r").stdout)["events"], 2)
                      config.write_text(canonical(policy(allowed_tools=[]).to_dict()), encoding="utf-8")
                      changed = run("replay", "r", "--policy", str(config), "--fail-on-change")
                      self.assertEqual(changed.returncode, 2, changed.stderr)
                      self.assertEqual(json.loads(changed.stdout)["changed"], ["a"])
                      self.assertEqual(run("verify", "unknown").returncode, 1)


          if __name__ == "__main__":
              unittest.main()
