[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keel-policy"
version = "0.1.0"
description = "Transactional policy gates and counterfactual replay for AI tool calls"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "9osiris"}]
dependencies = []

[project.scripts]
keel = "keel.cli:main"

[project.urls]
Repository = "https://github.com/9osiris/keel"

[tool.setuptools.packages.find]
include = ["keel*"]
